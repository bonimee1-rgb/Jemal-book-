
<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102c25">
  <meta name="description" content="Bon Quran - Read and learn the Holy Quran in Arabic, Amharic, English and Afaan Oromoo.">
  <title>Bon Quran | ቁርአን</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="./">
      <span class="brand-icon">۞</span>
      <span>Bon Quran<small>READ • LEARN • REMEMBER</small></span>
    </a>
    <button id="themeButton" class="icon-button" aria-label="Change theme">☾</button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <h1>Welcome to Bon Quran</h1>
      <p>ቁርአንን አንብብ፣ ተማር፣ አስታውስ።</p>
    </section>

    <section class="language-section">
      <h2>Choose your language</h2>
      <div class="languages">
        <button class="language active" data-lang="ar">العربية</button>
        <button class="language" data-lang="am">አማርኛ</button>
        <button class="language" data-lang="en">English</button>
        <button class="language" data-lang="om">Afaan Oromoo</button>
      </div>
    </section>

    <section class="search-section">
      <input id="searchInput" type="search"
        placeholder="Search Surah..." aria-label="Search Surah">
    </section>

    <section class="content-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">THE HOLY QURAN</p>
          <h2>Surah Library</h2>
        </div>
        <span class="count">114 Surahs</span>
      </div>

      <div id="surahList" class="surah-list">
        <div class="loading">Preparing Quran library...</div>
      </div>
    </section>

    <section class="reader" id="reader" hidden>
      <button id="backButton" class="back-button">← Back to Surahs</button>
      <h2 id="surahTitle"></h2>
      <div id="ayahList"></div>
    </section>
  </main>

  <footer>
    <p>Bon Quran</p>
    <small>Arabic • Amharic • English • Afaan Oromoo</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
